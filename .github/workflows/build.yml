   name: Build Windows exe

   on:
     workflow_dispatch:
     push:
       branches: [main, master]

   jobs:
     build:
       runs-on: windows-latest
       steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-python@v5
           with:
             python-version: "3.12"
         - name: Install dependencies
           run: |
             python -m pip install --upgrade pip
             pip install -r requirements.txt pyinstaller
         - name: Build exe
           run: pyinstaller --noconfirm --onefile --windowed --name DotVideoConverter --collect-all imageio_ffmpeg dotvideo_app.py
         - uses: actions/upload-artifact@v4
           with:
             name: DotVideoConverter-windows
             path: dist/DotVideoConverter.exe
